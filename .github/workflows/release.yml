name: Release

# On a v* tag: check the tag against the version in Cargo.toml, create a GitHub
# release whose body is that version's section of CHANGELOG.md, and attach the
# static x86_64 musl executables. The executables come from the Dockerfile's
# amd64 target, so they are the ones the image runs. image.yml pushes the image
# for the same tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      # Full history: the branch check below needs main's commits to find the
      # tagged one.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml
        run: scripts/check-version-tag.sh "$GITHUB_REF_NAME"

      # Fails when CHANGELOG.md has no section for the version, or the tagged
      # commit is not on main.
      - uses: taiki-e/create-gh-release-action@045e5c0ed9c50cc1f96de7e891a09ad3daea245f # v1.12.0
        with:
          changelog: CHANGELOG.md
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: x86_64-unknown-linux-musl
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build executables
        run: scripts/export-executables.sh dist

      - name: Prepare assets
        id: prepare
        run: |
          archive="zpaste_${GITHUB_REF_NAME}_x86_64-unknown-linux-musl.tar.zst"
          cp LICENSE README.md dist/
          tar --zstd -C dist -cf "$archive" LICENSE README.md zpaste wastebin-ctl
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.prepare.outputs.archive }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256"
