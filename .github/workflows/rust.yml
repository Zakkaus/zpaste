name: Rust

# Pull requests run the merge gate; a push to main runs it once more on the
# merged commit. Pushes to other branches run nothing, so a branch with an open
# pull request is not checked twice.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Rust
      uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      with:
        components: clippy,rustfmt
    # The server embeds web/dist, and its tests check the build's style hashes and files, so the
    # web app is built first and ZPASTE_REQUIRE_WEB=1 makes a missing build an error.
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm version from web/package.json packageManager
      with:
        package_json_file: web/package.json
    - name: Build the web app
      working-directory: web
      run: |
        pnpm install --frozen-lockfile
        pnpm build
    - run: cargo clippy -- -Dwarnings
      env:
        ZPASTE_REQUIRE_WEB: 1
    - run: cargo fmt --all --check
    - run: cargo test --all-targets
      env:
        ZPASTE_REQUIRE_WEB: 1

  spaces-check:
    name: Spaces Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Spaces check
        run: git diff-tree --check "$(git hash-object -t tree /dev/null)" HEAD

  requirements:
    name: Requirements check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I scripts/check-requirements.py
      - run: python3 -I scripts/test_check_requirements.py

  version-tag-check:
    name: Version tag check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/test_check_version_tag.sh
