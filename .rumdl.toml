# Inline HTML is intentional because of the README sugar.
[MD033]
allowed-elements = ["a", "img", "kbd", "p", "strong"]

[MD013]
headings = false
code-blocks = false

# The upstream README and CHANGELOG link to rendered examples as "here".
[per-file-ignores]
"docs/upstream/CHANGELOG.md" = ["MD059"]
"docs/upstream/WASTEBIN-README.md" = ["MD059"]
