[package]
name = "wastebin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
askama = { workspace = true }
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = { version = "0.8", features = ["json", "query", "macros"] }
axum-extra = { version = "0.12", features = ["cookie-signed", "typed-header"] }
brotli = "9"
cached = { version = "4.0.0", default-features = false }
cookie = { version = "0.18", features = ["signed"] }
flate2 = "1"
hex = "0.4"
hostname = "0.4.0"
http = "1.3"
mime = "0.3"
phf = { version = "0.14", features = ["macros"] }
rand = "0.10"
qrcodegen = "1"
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "timeout", "trace"] }
tracing = { workspace = true }
tracing-subscriber = "0.3"
url = "2"
utoipa = "=6.0.0"
wastebin_core = { path = "../wastebin_core/" }
wastebin_highlight = { path = "../wastebin_highlight/" }

[dev-dependencies]
itertools = "0.15.0"
jsonschema = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "form", "json", "query"] }
tower = { version = "0.5", default-features = false, features = ["util", "make"] }
yaml_serde = "=0.10.7"

[lints]
workspace = true

# The package keeps the upstream name so merges from wastebin stay clean; only
# the installed executable is renamed.
[[bin]]
name = "zpaste"
path = "src/main.rs"
