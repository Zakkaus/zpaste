openapi: 3.1.0
info:
  title: Zpaste API
  version: 0.1.0-draft
  summary: Paste service API, OpenStack style, under /v1.
  description: |
    Draft contract for review (plan section 四). It is written by hand; from P1 on,
    utoipa generates this file from the Rust handlers and the hand-written copy is
    retired (see `docs/api/README.md`).

    Conventions that hold for every `/v1` operation:

    - Request and response bodies are wrapped in the resource name
      (`{"paste": {...}}`, `{"pastes": [...]}`).
    - Every response carries `X-Request-Id` and `Cache-Control: no-store`.
    - Every error, including the framework's own rejections, uses the `Error`
      schema. A missing or expired paste is always 404.
    - 401 means no or invalid credentials; 403 means valid credentials that do not
      own the resource, or a cookie write without a matching `Origin`.
    - Each operation carries `x-phase`: the phase that implements it (P1, P2, P2b).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://paste.gentoozh.org
    description: Production
tags:
  - name: pages
    description: HTML pages served by the Rust shell.
  - name: versions
    description: API version discovery.
  - name: pastes
    description: Paste metadata, listing and deletion.
  - name: content
    description: Reading and replacing paste content.
  - name: history
    description: Stored versions of a paste.
  - name: workspaces
    description: Named groups of pastes shared by one link.

paths:
  /:
    get:
      tags: [pages]
      operationId: getNewPastePage
      summary: New paste page
      description: HTML shell of the web app's new paste page. Not part of the JSON API.
      x-phase: P1
      security: []
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema:
                type: string

  /v1:
    get:
      tags: [versions]
      operationId: getVersion
      summary: Show the API version
      x-phase: P1
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The current API version.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDocument'
              example:
                version: {id: v1, status: CURRENT}
        default: {$ref: '#/components/responses/Error'}

  /v1/pastes:
    post:
      tags: [pastes]
      operationId: createPaste
      summary: Create a paste
      description: |
        Credentials are optional. Without them the server mints a new identity and
        returns its `owner_token` once. With a valid Bearer token (or cookie) the new
        paste joins that identity and no token is returned. An invalid token is 401;
        the server never falls back to a new identity.
      x-phase: P1
      security:
        - {}
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasteCreateRequest'
            example:
              paste:
                content: "# Plan\n"
                extension: md
                title: Plan
                expires_in: 604800
                burn_after_reading: false
                password: null
      responses:
        '201':
          description: Created. The `owner_token` field is present only when a new identity was minted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Location:
              description: Path of the new paste, `/v1/pastes/{id}`.
              schema:
                type: string
                example: /v1/pastes/abc123
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteCreatedDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}
    get:
      tags: [pastes]
      operationId: listPastes
      summary: List the caller's pastes
      description: |
        Filters by identity and expiry first, then pages. Order is newest first by
        `(created_at, id)`; pastes from before the `created_at` column sort last.
        `pastes_links` holds only a `next` link, which keeps `owner=me` and `limit`.
      x-phase: P1
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: owner
          in: query
          required: true
          description: Only `me` is defined.
          schema:
            type: string
            enum: [me]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: marker
          in: query
          required: false
          description: |
            Id of the last paste on the previous page. A marker that is malformed,
            deleted, expired or owned by another identity gives the same 400.
          schema:
            $ref: '#/components/schemas/PasteId'
      responses:
        '200':
          description: One page of pastes.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteListDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}

  /v1/pastes/{id}:
    parameters:
      - $ref: '#/components/parameters/PasteIdPath'
    get:
      tags: [pastes]
      operationId: showPaste
      summary: Show paste metadata
      description: |
        Returns whitelisted fields only: never the uid, and no title for an
        encrypted paste. Reading metadata never consumes a burn-after-reading paste.
      x-phase: P1
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The paste.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteDocument'
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [pastes]
      operationId: updatePaste
      summary: Change the title
      description: |
        Follows the edit rules of plan section 四: burn-after-reading is 409; an
        encrypted paste needs `X-Paste-Password`, and a password that cannot
        decrypt the current content is 401 and writes nothing. In one transaction:
        a mismatching `If-Match` is 412; a title equal to the current one is 200
        with no new version; otherwise a new version is written. Expiry does not
        change.
      x-phase: P2
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/PastePasswordHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasteUpdateRequest'
            example:
              paste: {title: Plan v2}
      responses:
        '200':
          description: Updated, or unchanged when the title already matched.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/BurnNotEditable'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [pastes]
      operationId: deletePaste
      summary: Delete a paste
      description: Deletes the paste and its whole history.
      x-phase: P1
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}

  /v1/pastes/{id}/content:
    parameters:
      - $ref: '#/components/parameters/PasteIdPath'
    get:
      tags: [content]
      operationId: getContent
      summary: Read the content of a plain paste
      description: |
        Returns the raw text of a paste that is neither encrypted nor
        burn-after-reading. For those, it answers 409 with `password_required` or
        `confirmation_required` and consumes nothing.
      x-phase: P1
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The current content, UTF-8.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReadPrecondition'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [content]
      operationId: readContent
      summary: Read content with a password or a burn confirmation
      description: |
        The only way to consume a burn-after-reading paste: it is consumed once,
        when `confirm_burn` is true, and is 404 afterwards. A client that gets 404
        on a retry must treat the paste as possibly read and must not retry on its
        own. An encrypted burn paste needs both fields in the same request.
      x-phase: P1
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentReadRequest'
            examples:
              password:
                value: {password: hunter2}
              burn:
                value: {confirm_burn: true}
      responses:
        '200':
          description: The current content.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/WrongPassword'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReadPrecondition'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [content]
      operationId: replaceContent
      summary: Replace the content
      description: |
        The body is the raw new text. Same edit rules as `PATCH /v1/pastes/{id}`:
        burn-after-reading is 409; an encrypted paste needs `X-Paste-Password` and
        is re-encrypted with the same password and a new nonce; a mismatching
        `If-Match` is 412; content and title equal to the current version give 200
        with no new version; otherwise a new version is written and only the latest
        20 are kept. Expiry does not change.
      x-phase: P2
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/PastePasswordHeader'
      requestBody:
        required: true
        content:
          text/plain; charset=utf-8:
            schema:
              type: string
      responses:
        '200':
          description: Replaced, or unchanged when the content already matched.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/BurnNotEditable'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}

  /v1/pastes/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/PasteIdPath'
    get:
      tags: [history]
      operationId: listVersions
      summary: List stored versions
      description: |
        Newest first; at most 20 versions are kept, so there is no paging. The
        paste's existence and expiry are checked before anything else.
      x-phase: P2
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The stored versions.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionListDocument'
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}

  /v1/pastes/{id}/versions/{vid}/content:
    parameters:
      - $ref: '#/components/parameters/PasteIdPath'
      - name: vid
        in: path
        required: true
        description: A `version_id` from the version list.
        schema:
          $ref: '#/components/schemas/VersionId'
    post:
      tags: [history]
      operationId: readVersionContent
      summary: Read the content of one stored version
      description: Same request, responses and rules as `POST /v1/pastes/{id}/content`, for the named version.
      x-phase: P2
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentReadRequest'
      responses:
        '200':
          description: The content of that version; `ETag` is that version's id.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/WrongPassword'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReadPrecondition'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}

  /v1/workspaces:
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: Slugs are first come, first served.
      x-phase: P2b
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
            example:
              workspace: {slug: v2raya, title: v2rayA triage}
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Location:
              description: Path of the new workspace, `/v1/workspaces/{slug}`.
              schema:
                type: string
                example: /v1/workspaces/v2raya
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/SlugTaken'}
        default: {$ref: '#/components/responses/Error'}

  /v1/workspaces/{slug}:
    parameters:
      - $ref: '#/components/parameters/SlugPath'
    get:
      tags: [workspaces]
      operationId: showWorkspace
      summary: Show a workspace and its entries
      description: Anyone with the link can read it (unlisted). Entries of encrypted pastes carry no title.
      x-phase: P2b
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The workspace.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDocument'
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Change the title
      x-phase: P2b
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdateRequest'
      responses:
        '200':
          description: Updated.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: Deletes the grouping only. Its pastes keep their own expiry and links.
      x-phase: P2b
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}

  /v1/workspaces/{slug}/entries/{name}:
    parameters:
      - $ref: '#/components/parameters/SlugPath'
      - name: name
        in: path
        required: true
        description: Entry name, unique within the workspace.
        schema:
          type: string
          minLength: 1
    put:
      tags: [workspaces]
      operationId: putWorkspaceEntry
      summary: Create or update a named entry
      description: |
        The body is the raw text. When the name does not exist, a new paste is
        created in the caller's identity and added to the workspace (201). When it
        exists, this is `PUT /v1/pastes/{id}/content` on that entry's paste, with
        the same rules, `If-Match` and `X-Paste-Password` included (200). The link
        of the paste never changes.
      x-phase: P2b
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/PastePasswordHeader'
        - name: X-Paste-Extension
          in: header
          required: false
          description: Extension of a new entry's paste. Ignored when the entry exists, because an extension never changes after creation.
          schema:
            $ref: '#/components/schemas/Extension'
        - name: X-Entry-Kind
          in: header
          required: false
          description: Free-text category, for example `plan`, `result`, `review`, `log`.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          text/plain; charset=utf-8:
            schema:
              type: string
      responses:
        '200':
          description: The entry's paste was updated, or unchanged when the content already matched.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntryDocument'
        '201':
          description: A new paste was created and added under this name.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            ETag: {$ref: '#/components/headers/ETag'}
            Location:
              description: Path of the new paste, `/v1/pastes/{id}`.
              schema:
                type: string
                example: /v1/pastes/abc123
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntryDocument'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/BurnNotEditable'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [workspaces]
      operationId: deleteWorkspaceEntry
      summary: Remove an entry
      description: Removes the entry from the workspace. The paste itself stays.
      x-phase: P2b
      security:
        - ownerToken: []
        - ownerCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Removed.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <owner_token>`. The token is the server's signature
        over an identity's uid. Browsers never send it on their own, so Bearer
        requests skip the `Origin` check.
    ownerCookie:
      type: apiKey
      in: cookie
      name: uid
      description: |
        The web app's same-site cookie, in upstream's format (several identities;
        the first one creates). Because browsers send it on their own, a write that
        carries it must send `Origin` equal to the configured public URL (scheme,
        host and port); a missing, `null` or foreign `Origin` is 403.

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Kept when it matches the pattern; otherwise the server makes its own. Echoed on every response.
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{1,64}$'
    PasteIdPath:
      name: id
      in: path
      required: true
      description: Paste id without extension.
      schema:
        $ref: '#/components/schemas/PasteId'
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Slug'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        One strong entity tag, `"<version_id>"`, compared strongly (RFC 9110).
        Without it the write overwrites whatever is current.
      schema:
        $ref: '#/components/schemas/EntityTag'
    PastePasswordHeader:
      name: X-Paste-Password
      in: header
      required: false
      description: |
        Password of an encrypted paste, as base64url of its UTF-8 bytes. Required
        when the paste is encrypted; never logged.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+={0,2}$'

  headers:
    RequestId:
      description: The request id the server used.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{1,64}$'
    NoStore:
      description: Always `no-store` on `/v1`.
      required: true
      schema:
        type: string
        const: no-store
    ETag:
      description: The current version, `"<version_id>"`.
      required: true
      schema:
        $ref: '#/components/schemas/EntityTag'
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 0
    BearerChallenge:
      description: |
        Challenge for the owner token, for example `Bearer realm="zpaste"`. When the
        401 comes from a failed `X-Paste-Password`, the password challenge instead.
      required: true
      schema:
        type: string
    PasswordChallenge:
      description: Challenge for the paste password. The scheme name is an open question (`docs/api/README.md`).
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Any other error, in the same shape (for example 405, 415, 500, 503).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    BadRequest:
      description: The request is malformed or a field is invalid. Body parse errors are 400, not 422.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            error: {code: 400, type: bad_request, title: Bad Request, message: invalid marker, request_id: req-1}
    Unauthorized:
      description: |
        No credentials, or credentials that fail verification. On an edit of an
        encrypted paste, also a missing or wrong `X-Paste-Password`; nothing is
        written.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        WWW-Authenticate: {$ref: '#/components/headers/BearerChallenge'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    WrongPassword:
      description: The password is wrong.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        WWW-Authenticate: {$ref: '#/components/headers/PasswordChallenge'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            error: {code: 401, type: wrong_password, title: Unauthorized, message: wrong password, request_id: req-1}
    Forbidden:
      description: Valid credentials that do not own the resource, or a cookie write without a matching `Origin`.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: Does not exist or has expired; the two are not told apart.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    ReadPrecondition:
      description: |
        The read needs a password (`password_required`) or a burn confirmation
        (`confirmation_required`). Nothing is consumed.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            error: {code: 409, type: confirmation_required, title: Conflict, message: confirm to read; the paste is deleted after reading, request_id: req-1}
    BurnNotEditable:
      description: A burn-after-reading paste cannot be edited (`burn_not_editable`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    SlugTaken:
      description: The slug is already taken (`slug_taken`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    PreconditionFailed:
      description: '`If-Match` does not match the current version (`version_conflict`). `ETag` carries the current version.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            error: {code: 412, type: version_conflict, title: Precondition Failed, message: content changed since version 3, request_id: req-1}
    PayloadTooLarge:
      description: The body exceeds `WASTEBIN_MAX_BODY_SIZE` bytes, or the paste's history would exceed its cap.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    TooManyRequests:
      description: |
        The shared limit on password derivation (concurrency, or rate per client
        IP) is exceeded.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'

  schemas:
    PasteId:
      type: string
      description: 6 or 11 characters from upstream's alphabet, without extension.
      pattern: '^([A-Za-z0-9+-]{6}|[A-Za-z0-9+-]{11})$'
      example: abc123
    VersionId:
      type: string
      description: Hash-chain id of a version (plan section 四), 64 lowercase hex digits.
      pattern: '^[0-9a-f]{64}$'
    EntityTag:
      type: string
      description: A strong entity tag, `"<version_id>"`.
      pattern: '^"[0-9a-f]{64}"$'
    Slug:
      type: string
      pattern: '^[a-z0-9-]{2,40}$'
      example: v2raya
    Extension:
      type: string
      description: Upstream's rule, file names such as `CMakeLists.txt` included.
      pattern: '^[A-Za-z0-9._-]{1,32}$'
      example: md
    Title:
      type: [string, 'null']
      maxLength: 256
      description: At most 256 characters; null means no title.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
      example: '2026-11-21T13:00:00Z'

    Link:
      type: object
      required: [rel, href]
      properties:
        rel:
          type: string
          enum: [self, bookmark, next]
        href:
          type: string
          format: uri
    PasteLinks:
      type: array
      description: '`self` is the API URL; `bookmark` is the reading page, `/<id>.<ext>` when the paste has an extension.'
      items:
        $ref: '#/components/schemas/Link'
      example:
        - {rel: self, href: 'https://paste.gentoozh.org/v1/pastes/abc123'}
        - {rel: bookmark, href: 'https://paste.gentoozh.org/abc123.md'}

    VersionDocument:
      type: object
      required: [version]
      properties:
        version:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
              const: v1
            status:
              type: string
              enum: [CURRENT]

    PasteCreate:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          description: UTF-8; its size in bytes is at most `WASTEBIN_MAX_BODY_SIZE` (64 MiB in production).
        extension:
          $ref: '#/components/schemas/Extension'
        title:
          $ref: '#/components/schemas/Title'
        expires_in:
          type: [integer, 'null']
          minimum: 0
          description: |
            Seconds. Must be one of the values in `WASTEBIN_PASTE_EXPIRATIONS`;
            omitted or null takes the value marked default there (7 days in
            production). 0 means never, and only where that list allows it.
          example: 604800
        burn_after_reading:
          type: boolean
          default: false
        password:
          type: [string, 'null']
          minLength: 1
          description: When set, the content is encrypted with it.
    PasteCreateRequest:
      type: object
      required: [paste]
      additionalProperties: false
      properties:
        paste:
          $ref: '#/components/schemas/PasteCreate'

    Paste:
      type: object
      description: Whitelisted metadata. Never carries the uid; an encrypted paste has no `title` field.
      required: [id, extension, encrypted, burn_after_reading, expires_at, version, version_id, links]
      properties:
        id:
          $ref: '#/components/schemas/PasteId'
        extension:
          type: [string, 'null']
          description: Stored at creation; null for pastes from before the column.
        title:
          $ref: '#/components/schemas/Title'
        encrypted:
          type: boolean
        burn_after_reading:
          type: boolean
        expires_at:
          type: [string, 'null']
          format: date-time
          description: RFC 3339, UTC; null when the paste never expires.
        version:
          type: integer
          minimum: 1
          description: Depth in the version chain, for ordering and display only.
        version_id:
          $ref: '#/components/schemas/VersionId'
        links:
          $ref: '#/components/schemas/PasteLinks'
    PasteCreated:
      description: A paste as returned by create.
      allOf:
        - $ref: '#/components/schemas/Paste'
        - type: object
          properties:
            owner_token:
              type: string
              description: Present only when the create minted a new identity. Shown once; never logged.
    PasteDocument:
      type: object
      required: [paste]
      properties:
        paste:
          $ref: '#/components/schemas/Paste'
    PasteCreatedDocument:
      type: object
      required: [paste]
      properties:
        paste:
          $ref: '#/components/schemas/PasteCreated'
      example:
        paste:
          id: abc123
          extension: md
          title: Plan
          encrypted: false
          burn_after_reading: false
          expires_at: '2026-11-21T13:00:00Z'
          version: 1
          version_id: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          owner_token: example-owner-token
          links:
            - {rel: self, href: 'https://paste.gentoozh.org/v1/pastes/abc123'}
            - {rel: bookmark, href: 'https://paste.gentoozh.org/abc123.md'}
    PasteListDocument:
      type: object
      required: [pastes, pastes_links]
      properties:
        pastes:
          type: array
          items:
            $ref: '#/components/schemas/Paste'
        pastes_links:
          type: array
          description: Holds one `next` link while more pages exist; empty on the last page.
          maxItems: 1
          items:
            $ref: '#/components/schemas/Link'
          example:
            - {rel: next, href: 'https://paste.gentoozh.org/v1/pastes?owner=me&limit=20&marker=abc123'}
    PasteUpdate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/Title'
    PasteUpdateRequest:
      type: object
      required: [paste]
      additionalProperties: false
      properties:
        paste:
          $ref: '#/components/schemas/PasteUpdate'

    ContentReadRequest:
      type: object
      additionalProperties: false
      description: |
        `password` for an encrypted paste, `confirm_burn: true` for a
        burn-after-reading paste, both for one that is both. `{}` reads a plain
        stored version.
      properties:
        password:
          type: string
          minLength: 1
        confirm_burn:
          type: boolean
          const: true
    ContentDocument:
      type: object
      required: [content]
      properties:
        content:
          type: object
          required: [text, version_id]
          properties:
            text:
              type: string
            version_id:
              $ref: '#/components/schemas/VersionId'

    Version:
      type: object
      description: One stored version. An encrypted paste's versions have no `title` field.
      required: [version, version_id, parent_id, created_at]
      properties:
        version:
          type: integer
          minimum: 1
        version_id:
          $ref: '#/components/schemas/VersionId'
        parent_id:
          description: Null for the first version.
          oneOf:
            - $ref: '#/components/schemas/VersionId'
            - type: 'null'
        created_at:
          type: [string, 'null']
          format: date-time
          description: RFC 3339, UTC; null for the first version backfilled by the migration.
        title:
          $ref: '#/components/schemas/Title'
    VersionListDocument:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Version'

    WorkspaceCreate:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          $ref: '#/components/schemas/Title'
    WorkspaceCreateRequest:
      type: object
      required: [workspace]
      additionalProperties: false
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceCreate'
    WorkspaceUpdateRequest:
      type: object
      required: [workspace]
      additionalProperties: false
      properties:
        workspace:
          type: object
          required: [title]
          additionalProperties: false
          properties:
            title:
              $ref: '#/components/schemas/Title'
    WorkspaceEntry:
      type: object
      description: An entry whose paste is encrypted has no `title` field. Entries whose paste has expired are left out.
      required: [name, kind, paste_id, version, updated_at, links]
      properties:
        name:
          type: string
        kind:
          type: [string, 'null']
          description: Free-text category; null groups under "other".
        paste_id:
          $ref: '#/components/schemas/PasteId'
        title:
          $ref: '#/components/schemas/Title'
        version:
          type: integer
          minimum: 1
        updated_at:
          type: [string, 'null']
          format: date-time
          description: Time of the paste's current version, RFC 3339, UTC.
        links:
          $ref: '#/components/schemas/PasteLinks'
    WorkspaceEntryDocument:
      type: object
      required: [entry]
      properties:
        entry:
          $ref: '#/components/schemas/WorkspaceEntry'
    Workspace:
      type: object
      required: [slug, title, created_at, updated_at, entries, links]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        title:
          $ref: '#/components/schemas/Title'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceEntry'
        links:
          type: array
          description: '`self` is the API URL; `bookmark` is `/w/<slug>`.'
          items:
            $ref: '#/components/schemas/Link'
    WorkspaceDocument:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'

    Error:
      type: object
      required: [code, type, title, message, request_id]
      properties:
        code:
          type: integer
          description: The HTTP status code.
        type:
          type: string
          description: |
            Machine-readable kind. Named by the plan: `version_conflict`,
            `password_required`, `confirmation_required`. Drafted here:
            `bad_request`, `unauthorized`, `wrong_password`, `forbidden`,
            `not_found`, `burn_not_editable`, `slug_taken`, `payload_too_large`,
            `rate_limited`, `internal_error`.
        title:
          type: string
          description: The HTTP reason phrase.
        message:
          type: string
          description: Human-readable detail. Carries no internal or upstream detail.
        request_id:
          type: string
          description: Same value as the `X-Request-Id` response header.
    ErrorDocument:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
